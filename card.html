<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#faf9f4">
  <meta name="description" content="有一张会发光的贺卡，等你打开">
  <meta property="og:title" content="有一张贺卡，等你打开">
  <meta property="og:description" content="点按开启：信封缓缓打开，标题逐字亮起，祝福浮现，天灯升空。">
  <meta property="og:image" content="https://hanabi-sigma.vercel.app/assets/share.jpg">
  <meta property="og:url" content="https://hanabi-sigma.vercel.app/card.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="有一张贺卡，等你打开">
  <meta name="twitter:image" content="https://hanabi-sigma.vercel.app/assets/share.jpg">
  <title>有一张贺卡，等你打开</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23d8b46a'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='%23191408' font-family='serif' font-weight='700'%3E%E8%8A%B1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="card-page">
  <!-- 背景层：纸白底 + 极淡噪点 -->
  <div class="bg" aria-hidden="true"></div>

  <!-- 粒子层（Canvas） -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- 内容舞台 -->
  <main class="stage" id="stage">
    <div class="stage-inner">
      <p class="to-line" id="toLine"></p>

      <div class="title-block">
        <h1 class="card-title" id="cardTitle"></h1>
        <svg class="title-stroke" id="titleStroke" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true">
          <path d="M4 9 C 60 3, 150 2, 296 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" pathLength="100"/>
        </svg>
      </div>

      <div class="orn" id="ornDiv" aria-hidden="true"><i></i><b></b><i></i></div>

      <div class="msg-wrap" id="msgWrap">
        <p class="card-msg" id="cardMsg"></p>
      </div>

      <!-- 照片：拍立得式一张（可选） -->
      <div class="photo-wrap" id="photoWrap">
        <figure class="photo" id="photoFig">
          <img id="photoImg" alt="照片" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
        </figure>
      </div>

      <!-- 自定义信笺：用户上传的 HTML（占位符替换后沙盒展示） -->
      <div class="letter-wrap" id="letterWrap">
        <iframe id="letterFrame" title="自定义信笺" sandbox="allow-scripts allow-popups"></iframe>
      </div>

      <!-- 生日场景：蛋糕 + 蜡烛 -->
      <div class="cake-wrap" id="cakeWrap">
        <div class="cake" id="cake" role="button" aria-label="点一下吹灭蜡烛" title="点一下吹灭蜡烛">
          <span class="cake-plate"></span>
          <span class="cake-bottom"></span>
          <span class="cake-top"><i class="icing"></i></span>
          <i class="candle" style="left:58px"><i class="flame"></i><i class="smoke" style="--sd:0s"></i></i>
          <i class="candle" style="left:91px"><i class="flame"></i><i class="smoke" style="--sd:.12s"></i></i>
          <i class="candle" style="left:124px"><i class="flame"></i><i class="smoke" style="--sd:.24s"></i></i>
        </div>
        <button class="btn btn-primary btn-blow" id="blowBtn" type="button">吹蜡烛</button>
      </div>

      <!-- 署名：手写笔迹（可选）+ 文字署名 + 一点青瓷 -->
      <div class="sign-row" id="signRow">
        <span class="sign-dash" aria-hidden="true"></span>
        <canvas class="sign-canvas" id="signCanvas" hidden aria-label="手写署名"></canvas>
        <span class="signature" id="sigEl"></span>
        <span class="seal" id="sealEl" aria-hidden="true"></span>
      </div>

      <!-- 帖号签语：结尾浮现 -->
      <p class="fortune" id="fortuneEl"></p>

      <div class="end-actions" id="endActions">
        <button class="btn btn-ghost" id="replayBtn" type="button">再看一遍</button>
        <a class="btn btn-primary" href="index.html" id="makeBtn">回 TA 一张</a>
      </div>
    </div>
  </main>

  <p class="hint" id="hintEl" aria-hidden="true">轻触屏幕 · 赠一颗心</p>
  <p class="edition" id="editionEl" aria-hidden="true"></p>

  <!-- 顶部小件 -->
  <button class="chip chip-skip" id="skipBtn" type="button">跳过 ›</button>
  <button class="chip chip-mute" id="muteBtn" type="button"><span class="note" aria-hidden="true">♪</span>音乐</button>

  <!-- 开场：信封（通用）/ 礼盒（生日·圣诞） -->
  <div class="open-overlay" id="openOverlay" role="button" tabindex="0" aria-label="点按开启贺卡">
    <div class="open-inner">
      <div class="env" id="envObj" aria-hidden="true">
        <span class="env-back"></span>
        <div class="env-letter">
          <span class="env-letter-to" id="envLetterTo"></span>
          <span class="env-letter-sub">HANABI</span>
        </div>
        <span class="env-pocket"></span>
        <span class="env-flap"></span>
        <i class="env-seal"></i>
      </div>

      <div class="gift" id="giftObj" aria-hidden="true">
        <i class="gift-glow"></i>
        <div class="gift-box"><i class="gift-ribbon-v"></i></div>
        <div class="gift-lid"><i class="gift-ribbon-l"></i><i class="gift-bow"><i></i><i></i></i></div>
      </div>

      <p class="open-hint" aria-hidden="true">点 按 开 启</p>
      <div class="open-ground" aria-hidden="true"></div>
    </div>
  </div>
  <span class="open-edition" id="openEditionEl" aria-hidden="true"></span>

  <!-- 噪点层置顶 -->
  <div class="noise" aria-hidden="true"></div>

  <script src="js/config.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
